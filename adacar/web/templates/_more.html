{# Counted on the page: cars added while a search runs shift the next page. #}
<button type="button" class="secondary outline more"
        hx-get="/results?{{ qs }}" hx-vals='js:{offset: document.querySelectorAll("#car-list > .car").length}'
        hx-target="this" hx-swap="outerHTML">{{ t("search.more") }}</button>

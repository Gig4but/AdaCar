lor: transparent; color: rgb(0, 0, 0);\"> pro vaší rodinu nebo cestu do zaměstnání? Právě pro vás máme připravenou nabídku </span><strong style=\"background-color: transparent; color: rgb(0, 0, 0);\">osobních automobilů od několika značek</strong><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">, ve které si vybere opravdu každý. Prozradíme vám </span><strong style=\"background-color: transparent; color: rgb(0, 0, 0);\">historii těchto dvoustopých motorových vozidel</strong><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">, </span><strong style=\"background-color: transparent; color: rgb(0, 0, 0);\">nejznámější výrobce</strong><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">, </span><strong style=\"background-color: transparent; color: rgb(0, 0, 0);\">jednotlivé typy</strong><span style=\"background-color: transparent; color: rgb(0, 0, 0);\"> a </span><strong style=\"background-color: transparent; color: rgb(0, 0, 0);\">technické parametry</strong><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">. Podívejte se na naši </span><strong style=\"background-color: transparent; color: rgb(0, 0, 0);\">aktuální</strong><span style=\"background-color: transparent; color: rgb(0, 0, 0);\"> nabídku.</span></p></div></div><div  data-layout=\"text-image\"><div class=\"text-container ql-editor\"><div class=\"inner-container\"><h2><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">Historie osobních automobilů</span></h2><p><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">Již koncem </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">18. století</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\"> konstruktéři vymysleli vozidlo, které se pohybovalo </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">pomocí parního stroje</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, zásadní zlom však přišel až s vynálezem spalovacího motoru od </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">Nicolause Otta</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">. První automobil (motorová tříkolka), který se pohyboval pomocí spalovacího motoru, vymyslel </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">Karl Benz</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\"> v roce </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">1885</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">. Na území České republiky byl prvním funkčním automobilem </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">Präsident</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\"> v roce </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">1897</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\"> od automobilky v Kopřivnici.</span></p></div></div><div class=\"image-container\"><img src=\"https://cdn.aukro.cz/category/133540454.jpeg\" alt=\"Historický osobní automobil\"></div></div><div  data-layout=\"image-text\"><div class=\"image-container\"><img src=\"https://cdn.aukro.cz/category/133540478.jpeg\" alt=\"Mercedes Benz\"></div><div class=\"text-container ql-editor\"><div class=\"inner-container\"><h2><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">Nejznámější výrobci osobních automobilů</span></h2><p><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">Ve světě existuje </span><strong style=\"background-color: transparent; color: rgb(0, 0, 0);\">několik desítek výrobců automobilů</strong><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">, aktuálně největším výrobce je </span><a href=\"/toyota\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(17, 85, 204);\"><strong>Toyota</strong></a><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">. Mezi další </span><strong style=\"background-color: transparent; color: rgb(0, 0, 0);\">celosvětově známé výrobce</strong><span style=\"background-color: transparent; color: rgb(0, 0, 0);\"> patří například </span><a href=\"/volkswagen\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(17, 85, 204);\"><strong>Volkswagen</strong></a><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">, </span><a href=\"/ford\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(17, 85, 204);\"><strong>Ford</strong></a><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">, </span><a href=\"/renault\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(17, 85, 204);\"><strong>Renault</strong></a><span style=\"background-color: transparent; color: rgb(0, 0, 0);\"> a </span><a href=\"/fiat\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(17, 85, 204);\"><strong>Fiat</strong></a><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">. Českým výrobcem osobních automobilů je pro všechny známá </span><a href=\"/lp/skoda-auto\" rel=\"noopener noreferrer\" target=\"_blank\" style=\"background-color: transparent; color: rgb(17, 85, 204);\"><strong>Škoda Auto</strong></a><span style=\"background-color: transparent; color: rgb(0, 0, 0);\">.</span></p></div></div></div><div  data-layout=\"text-image\"><div class=\"text-container ql-editor\"><div class=\"inner-container\"><h2><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">Osobní automobily podle tvaru karoserie</span></h2><p><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">Při výběru se můžete setkat s několika typy karoserie, které jsou odlišné na první pohled. V naší nabídce naleznete </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">sedany</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">kombíky</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">hatchbacky</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">liftbacky</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">coupé</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">kabriolety</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\"> a </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">roadstery</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">. K dalším tvarům karoserie patří i </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">off-roady</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">SUV</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">MPV</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">shooting brake</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\"> a </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">limuzíny</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">.</span></p></div></div><div class=\"image-container\"><img src=\"https://cdn.aukro.cz/category/133540487.jpeg\" alt=\"Ford\"></div></div><div  data-layout=\"image-text\"><div class=\"image-container\"><img src=\"https://cdn.aukro.cz/category/133540490.jpeg\" alt=\"Mustang\"></div><div class=\"text-container ql-editor\"><div class=\"inner-container\"><h2><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">Technické parametry osobních automobilů</span></h2><p><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">Dnešní moderní osobní automobily jsou nejčastěji </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">2</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\"> nebo </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">3prostorové</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, kdy posádka automobilu je oddělena od prostoru zavazadel a motoru. Váha osobních automobilů se po letech výroby zvedla až na rozmezí </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">1400–⁠1530 kilogramů</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">, a to především kvůli </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">vývoji bezpečnosti cestujících</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\"> a </span><strong style=\"color: rgb(0, 0, 0); background-color: transparent;\">vybavení samotných automobilů</strong><span style=\"color: rgb(0, 0, 0); background-color: transparent;\">.</span></p></div></div></div></div>", "feedRestriction": false, "hasLandingPage": false, "hiddenForExpose": false, "hreflang": true, "id": 48715, "itemCategoryId": 48715, "leaf": false, "level": 2, "maxItemImages": 8, "metaDescription": "Najděte si <category_name>. Více než 100 nabídek v aukci, často už od 1 Kč. <category_name> máme nové i z druhé ruky. Výh
